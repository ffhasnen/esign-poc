<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 850" role="img" aria-label="Flow diagram: MainActivity starts CspActivity, which loads the Flutter CSP app in WebView 1. Tapping eSign calls window.open, caught by CspActivity's onCreateWindow, which starts EsignActivity with WebView 2, full screen. On the eSign page, tapping Success or Fail calls a JavaScript bridge, AndroidEsignBridge.postMessage. EsignActivity validates that result and finishes, handing it back to CspActivity as an Activity result. CspActivity then delivers the result into WebView 1 by running evaluateJavascript with window.postMessage. A small marker next to WebView 2 notes that window.opener.postMessage, the normal browser mechanism, does not exist here, since WebView 1 and WebView 2 are separate, unrelated instances.">
  <style>
    :root {
      --ink: #1c2430;
      --muted: #5b6472;
      --paper: #f6f7fa;
      --panel: #ffffff;
      --panel-border: #d7dbe3;
      --native-fill: #eef1f7;
      --accent: #2f6fed;
      --broken: #c8382f;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --ink: #e9ecf1;
        --muted: #9aa3b2;
        --paper: #13161b;
        --panel: #1b1f26;
        --panel-border: #333a45;
        --native-fill: #242a33;
        --accent: #7ea2ff;
        --broken: #ff7a70;
      }
    }
    svg { color: var(--ink); }
    text { font-family: system-ui, -apple-system, sans-serif; }
    .mono { font-family: ui-monospace, 'SF Mono', Consolas, monospace; }
  </style>

  <rect x="0" y="0" width="820" height="850" fill="var(--paper)"/>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
    <marker id="arrowAccent" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--accent)"/>
    </marker>
  </defs>

  <g fill="currentColor">

    <!-- MainActivity -->
    <rect x="220" y="20" width="200" height="44" rx="8" fill="var(--panel)" stroke="var(--panel-border)"/>
    <text x="320" y="47" text-anchor="middle" font-size="13" font-weight="600">MainActivity</text>

    <line x1="320" y1="64" x2="320" y2="102" stroke="currentColor" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text class="mono" x="336" y="88" font-size="11" fill="var(--muted)">startActivity(CspActivity, cspUrl)</text>

    <!-- CspActivity panel -->
    <rect x="60" y="104" width="520" height="326" rx="10" fill="var(--paper)" stroke="var(--panel-border)"/>
    <text x="76" y="126" font-size="12" font-weight="600" fill="var(--muted)" letter-spacing="0.03em">CSPACTIVITY &#8212; SCREEN 1</text>

    <!-- WebView 1 -->
    <rect x="90" y="140" width="460" height="86" rx="8" fill="var(--panel)" stroke="var(--panel-border)"/>
    <text x="320" y="168" text-anchor="middle" font-size="14" font-weight="600">WebView 1</text>
    <text x="320" y="188" text-anchor="middle" font-size="12" fill="var(--muted)">Flutter CSP app</text>
    <text class="mono" x="320" y="206" text-anchor="middle" font-size="11" fill="var(--muted)">loadUrl(cspUrl)</text>

    <!-- gap: WebView1 -> native, generous -->
    <line x1="180" y1="226" x2="180" y2="296" stroke="var(--accent)" stroke-width="1.5" marker-end="url(#arrowAccent)"/>
    <text x="196" y="255" font-size="11" fill="var(--accent)">tap eSign &#8594;</text>
    <text class="mono" x="196" y="270" font-size="11" fill="var(--accent)">window.open()</text>

    <!-- CspActivity native box -->
    <rect x="90" y="296" width="460" height="114" rx="8" fill="var(--native-fill)" stroke="var(--panel-border)"/>
    <text class="mono" x="320" y="320" text-anchor="middle" font-size="13" font-weight="600">CspActivity.kt</text>
    <text x="320" y="344" text-anchor="middle" font-size="11.5" fill="var(--muted)">onCreateWindow() catches window.open()</text>
    <text x="320" y="364" text-anchor="middle" font-size="11.5" fill="var(--muted)">and captures the eSign URL</text>

    <line x1="320" y1="430" x2="320" y2="468" stroke="currentColor" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text class="mono" x="336" y="454" font-size="11" fill="var(--muted)">startActivityForResult(EsignActivity)</text>

    <!-- EsignActivity panel -->
    <rect x="60" y="470" width="520" height="326" rx="10" fill="var(--paper)" stroke="var(--panel-border)"/>
    <text x="76" y="492" font-size="12" font-weight="600" fill="var(--muted)" letter-spacing="0.03em">ESIGNACTIVITY &#8212; SCREEN 2, FULL SCREEN</text>

    <!-- WebView 2 -->
    <rect x="90" y="506" width="460" height="86" rx="8" fill="var(--panel)" stroke="var(--panel-border)"/>
    <text x="320" y="534" text-anchor="middle" font-size="14" font-weight="600">WebView 2</text>
    <text x="320" y="554" text-anchor="middle" font-size="12" fill="var(--muted)">eSign page (Perfios / UIDAI)</text>
    <text class="mono" x="320" y="572" text-anchor="middle" font-size="11" fill="var(--muted)">loadUrl(esignUrl)</text>

    <!-- small "doesn't exist" marker, own row, no long-distance line -->
    <circle cx="500" cy="627" r="9" fill="var(--paper)" stroke="var(--broken)" stroke-width="1.5"/>
    <text x="500" y="631" text-anchor="middle" font-size="11" fill="var(--broken)" font-weight="700">&#10005;</text>
    <text x="515" y="624" font-size="10.5" fill="var(--broken)">window.opener</text>
    <text x="515" y="637" font-size="10.5" fill="var(--broken)">doesn't exist here</text>

    <!-- gap: WebView2 -> native, generous -->
    <line x1="180" y1="592" x2="180" y2="662" stroke="var(--accent)" stroke-width="1.5" marker-end="url(#arrowAccent)"/>
    <text x="196" y="621" font-size="11" fill="var(--accent)">tap Success / Fail &#8594;</text>
    <text class="mono" x="196" y="636" font-size="11" fill="var(--accent)">AndroidEsignBridge</text>
    <text class="mono" x="196" y="650" font-size="11" fill="var(--accent)">.postMessage(json)</text>

    <!-- EsignActivity native box -->
    <rect x="90" y="662" width="460" height="114" rx="8" fill="var(--native-fill)" stroke="var(--panel-border)"/>
    <text class="mono" x="320" y="686" text-anchor="middle" font-size="13" font-weight="600">EsignActivity.kt</text>
    <text x="320" y="710" text-anchor="middle" font-size="11.5" fill="var(--muted)">validates the JSON, sets it as the</text>
    <text x="320" y="730" text-anchor="middle" font-size="11.5" fill="var(--muted)">Activity result, then finish()</text>

    <!-- single continuous return path, right margin, plain horizontal labels -->
    <path d="M550,719 L630,719 L630,183 L552,183" fill="none" stroke="var(--accent)" stroke-width="1.5" marker-end="url(#arrowAccent)"/>
    <text x="644" y="695" font-size="11" fill="var(--accent)">EsignActivity finishes,</text>
    <text x="644" y="710" font-size="11" fill="var(--accent)">hands result to CspActivity</text>
    <text x="644" y="160" font-size="11" fill="var(--accent)">CspActivity delivers it:</text>
    <text class="mono" x="644" y="177" font-size="11" fill="var(--accent)">window.postMessage(json)</text>

  </g>
</svg>
